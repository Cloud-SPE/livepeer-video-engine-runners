[project]
name = "livepeer-video-engine-runners"
version = "0.2.0"
description = "Run LightX2V, SGLang Diffusion and vLLM-Omni as Livepeer live runners: text-to-video over SSE or trickle, with runtime model switching."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Cloud SPE" }]
keywords = ["livepeer", "video-generation", "text-to-video", "lightx2v", "sglang", "vllm-omni", "gpu"]
dependencies = [
    "livepeer-gateway==1.0.0",
    "aiohttp>=3.9",
    "prometheus-client==0.26.0",
]

[project.urls]
Homepage = "https://github.com/Cloud-SPE/livepeer-video-engine-runners"
Issues = "https://github.com/Cloud-SPE/livepeer-video-engine-runners/issues"
Changelog = "https://github.com/Cloud-SPE/livepeer-video-engine-runners/blob/main/CHANGELOG.md"

[dependency-groups]
assets = ["huggingface-hub==1.0.1"]
stub = ["av>=11", "numpy>=1.26"]
dev = ["pytest>=8.3", { include-group = "stub" }]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_runners"]

[project.scripts]
video-runner = "video_runners.runner.app:main"
video-controller = "video_runners.controller.app:main"
video-client = "video_runners.client:cli"
video-stub-engine = "video_runners.stub_engine:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
