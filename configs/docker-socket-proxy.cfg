# Tecnativa proxy template with exact methods/routes for this controller.
# Resource ownership and creation-body policy remain the controller's job.
global
    log stdout format raw daemon "${LOG_LEVEL}"
defaults
    mode http
    log global
    timeout connect 5s
    timeout client 65s
    timeout server 65s
frontend dockerfrontend
    bind ${BIND_CONFIG}
    acl inspect method GET
    acl create method POST
    acl remove method DELETE
    acl read_path path_reg ^/v1\.51/containers/(json|[a-f0-9]{64}/json)$
    acl write_path path_reg ^/v1\.51/containers/(create|[a-f0-9]{64}/(start|stop))$
    acl remove_path path_reg ^/v1\.51/containers/[a-f0-9]{64}$
    http-request allow if inspect read_path
    http-request allow if create write_path
    http-request allow if remove remove_path
    http-request deny
    default_backend dockerbackend
backend dockerbackend
    server dockersocket ${SOCKET_PATH}
