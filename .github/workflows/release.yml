name: CPU container release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Explicit release or source tag (never latest)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  publish:
    # CPU images only; operators prepare GPU engines on their own hosts.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify source and deployment inputs
        run: |
          scripts/check.sh
          tests/e2e/compose-config.sh
      - name: Preview CPU release and optional node reuse
        env:
          NODE_RELEASE_MANIFEST: ${{ vars.CONTAINER_NODE_RELEASE_MANIFEST }}
          REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ['NODE_RELEASE_MANIFEST']
          if raw:
              directory = Path('artifacts/release-inputs')
              directory.mkdir(parents=True)
              (directory / 'node.json').write_text(json.dumps(json.loads(raw)))
          PY
          reuse=()
          if [ -f artifacts/release-inputs/node.json ]; then
            reuse=(--reuse-manifest artifacts/release-inputs/node.json)
          fi
          python3 src/video_runners/tools/release.py plan \
            --registry "$REGISTRY" --namespace "$NAMESPACE" \
            --tag "$RELEASE_TAG" "${reuse[@]}" > /dev/null
      - name: Log in to the operator registry
        env:
          REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          REGISTRY_USER: ${{ secrets.CONTAINER_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
        run: |
          test -n "$REGISTRY" && test -n "$REGISTRY_USER" && test -n "$REGISTRY_PASSWORD"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
      - name: Build, check and publish pinned images
        env:
          REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          reuse=()
          if [ -f artifacts/release-inputs/node.json ]; then
            reuse=(--reuse-manifest artifacts/release-inputs/node.json)
          fi
          python3 src/video_runners/tools/release.py publish \
            --registry "$REGISTRY" --namespace "$NAMESPACE" \
            --tag "$RELEASE_TAG" --output artifacts/container-release \
            "${reuse[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-release
          retention-days: 30
          path: |
            artifacts/container-release/manifest.json
            artifacts/container-release/release.env
