name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -v

  compose:
    # Every engine's compose configuration resolves, with and without the GPU
    # overlay. The GPU images themselves are too large to build here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for engine in stub lightx2v sglang vllm-omni; do
            ENGINE=$engine docker compose config -q
            ENGINE=$engine docker compose -f compose.yml -f compose.gpu.yml config -q
          done

  e2e:
    # The whole network path against a livepeer-node orchestrator built from
    # source, with the CPU stub engine.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: ENGINE=stub docker compose up -d --build --wait
      - run: scripts/e2e.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
