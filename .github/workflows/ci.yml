name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: scripts/check.sh

  compose:
    # Configuration resolution needs no daemon, GPU, wallet or private env file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/compose-config.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/video-runner-dist"
          uv venv "$RUNNER_TEMP/video-runner-wheel"
          uv export --locked --no-dev --group stub --no-emit-project --output-file "$RUNNER_TEMP/video-runner-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/video-runner-wheel/bin/python" -r "$RUNNER_TEMP/video-runner-requirements.txt" "$RUNNER_TEMP"/video-runner-dist/*.whl
          cd "$RUNNER_TEMP"
          for command in video-runner video-controller video-client video-stub-engine; do
            "$RUNNER_TEMP/video-runner-wheel/bin/$command" --help >/dev/null
          done

  e2e:
    # The whole network path against a livepeer-node orchestrator built from
    # source, with the CPU stub engine.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: tests/e2e/bundled.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cpu-bundled-evidence
          retention-days: 7
          path: |
            artifacts/cpu-validation/*/receipt.json
            artifacts/cpu-validation/*/resources.json

  managed-e2e:
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        engine: [stub, sglang, lightx2v, vllm-omni, all]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Hosted images may ship an older daemon than the proxy's API v1.51.
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        id: docker
        with:
          version: v29.8.2
          context: video-ci
      - name: Verify managed Docker API
        run: |
          docker version
          DOCKER_API_VERSION=1.51 docker info --format 'Managed Docker API ready: {{.ServerVersion}}'
      - run: uv sync --locked
      - name: Run managed CPU integration
        env:
          BUILDX_BUILDER: video-ci
          CI_DOCKER_SOCKET: ${{ steps.docker.outputs.sock }}
          TEST_ENGINE: ${{ matrix.engine }}
        run: |
          export DOCKER_SOCKET_PATH="${CI_DOCKER_SOCKET#unix://}"
          tests/e2e/managed.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cpu-managed-${{ matrix.engine }}-evidence
          retention-days: 7
          path: |
            artifacts/cpu-validation/*/receipt.json
            artifacts/cpu-validation/*/resources.json
