name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, client flags and request payloads. Replace private hosts, addresses, account identities and resource names with placeholders.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [stub, lightx2v, sglang, vllm-omni]
    validations:
      required: true
  - type: dropdown
    id: delivery
    attributes:
      label: Delivery mode
      options: [single-shot, persistent, both, not relevant]
  - type: input
    id: model
    attributes:
      label: Model id
      placeholder: fastwan2.1-t2v-1.3b
  - type: input
    id: gpu
    attributes:
      label: GPU, driver and CUDA version
      placeholder: RTX 4090 24 GB, driver 580.82, CUDA 12.8
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Commit of this repo, LIVEPEER_NODE_SOURCE, engine image tag.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Use your deployment's Compose/env selection to collect runner/controller logs; collect node logs from its own project. Remove secrets, private hosts/addresses, account identities and resource names before sharing."
      render: text
