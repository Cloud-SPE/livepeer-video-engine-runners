# Video engine runner on a livepeer-node orchestrator (offchain, free).
#
#   ENGINE=stub docker compose up -d --build        # no GPU needed
#   ENGINE=sglang docker compose -f compose.yml -f compose.gpu.yml up -d --build
#
# ENGINE picks docker/<engine>.Dockerfile and models/<engine>.json:
# stub | lightx2v | sglang | vllm-omni. The orchestrator is built from
# livepeer-node source (github.com/livepeer/node, which publishes no image):
# LIVEPEER_NODE_SOURCE is a git URL pinned to a commit, or a local checkout.

services:
  orchestrator:
    # Built with livepeer-node's own Dockerfile straight from its git repository,
    # pinned to a commit; upstream does not publish an image yet.
    build:
      context: ${LIVEPEER_NODE_SOURCE:-https://github.com/livepeer/node.git#08081dbda0f4f7b56e362e3af4b6965bfa1b73a4}
      dockerfile: docker/Dockerfile
    image: livepeer-node:local
    # Two addresses:
    #   service-url         advertised to clients in discovery and channel URLs,
    #                       so it must be reachable from the host (published port).
    #   runner-service-url  where the runner heartbeats and publishes trickle,
    #                       so it must resolve on the compose network.
    # The runner has a private address, so it needs a grant, and grants take
    # only IPs: the runner gets a fixed one on this project's network.
    command:
      - orchestrator
      - --config=
      - --listen=0.0.0.0:8935
      - --service-url=http://127.0.0.1:8935
      - --runner-service-url=http://orchestrator:8935
      - --runner-grants=${SUBNET_PREFIX:-172.30.88}.10:8989
    environment:
      LIVEPEER_ORCHESTRATOR_BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-devsecret}
    ports:
      - "127.0.0.1:8935:8935"
    # The image has no HTTP client; bash's /dev/tcp asks the loopback-only
    # metrics listener for readiness.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8936 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q ready <&3
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  runner:
    build:
      context: .
      dockerfile: docker/${ENGINE:-stub}.Dockerfile
    image: livepeer-video-engine-runners-${ENGINE:-stub}:local
    depends_on:
      orchestrator:
        condition: service_healthy
    command:
      - --host=0.0.0.0
      - --catalog=models/${ENGINE:-stub}.json
      - --model=${MODEL:-}
      - --orchestrator=http://orchestrator:8935
      - --runner-url=http://${SUBNET_PREFIX:-172.30.88}.10:8989
      - --admin-host=0.0.0.0
      - --delivery=${DELIVERY:-both}
    environment:
      LIVEPEER_BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-devsecret}
      RUNNER_ADMIN_TOKEN: ${RUNNER_ADMIN_TOKEN:-change-me}
      HF_TOKEN: ${HF_TOKEN:-}
    # Weights: Hugging Face downloads land in the shared cache; local checkpoints
    # (LightX2V, MiniMax-H3) are read from /models.
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${MODELS_DIR:-./weights}:/models
    ipc: host
    # Admin (model switching) is published to this host only; the orchestrator
    # proxies just the public port 8989.
    ports:
      - "127.0.0.1:8990:8990"
    # Healthy once the model is loaded and registered; loads can take minutes.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8989/healthz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60m
      start_interval: 2s
    networks:
      default:
        ipv4_address: ${SUBNET_PREFIX:-172.30.88}.10

networks:
  default:
    ipam:
      config:
        - subnet: ${SUBNET_PREFIX:-172.30.88}.0/24
