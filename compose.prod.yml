# Production provider: connect to an existing orchestrator. See the deployment guide.
services:
  runner:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/docker/cpu.Dockerfile
      target: runner
    image: livepeer-video-runner:local
    command:
      - --lifecycle=managed
      - --host=0.0.0.0
      - --catalog=models/${ENGINE:-all}.json
      - --model=${MODEL:-}
      - --controller-url=http://controller-control:9200
      - --orchestrator=${ORCHESTRATOR_URL:?Set the existing orchestrator URL}
      - --runner-url=${RUNNER_URL:?Set the private URL reachable from the orchestrator}
      - --admin-host=0.0.0.0
      - --delivery=${DELIVERY:-both}
    environment:
      LIVEPEER_BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?Match the orchestrator registration secret}
      RUNNER_ADMIN_TOKEN: ${RUNNER_ADMIN_TOKEN:?Set a private runner admin token}
      ENGINE_CONTROLLER_TOKEN: ${ENGINE_CONTROLLER_TOKEN:?Generate a controller token with openssl rand -hex 32}
    volumes:
      - ${PUBLIC_MODEL_CATALOG:-./models/${ENGINE:-all}.json}:/app/models/${ENGINE:-all}.json:ro
    depends_on:
      controller:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RUNNER_ADMIN_PORT:-8990}:8990"
      - "${RUNNER_BIND_HOST:-127.0.0.1}:${RUNNER_PORT:-8989}:8989"
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8989/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60m
      start_interval: 2s
    networks:
      default:
        ipv4_address: ${SUBNET_PREFIX:-172.30.88}.10
      engine: {}
      control: {}
  controller:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/docker/cpu.Dockerfile
      target: controller
    image: livepeer-video-controller:local
    command:
      - --catalog=/config/catalog.json
      - --host=${CONTROL_SUBNET_PREFIX:-172.30.89}.20
    environment:
      ENGINE_CONTROLLER_TOKEN: ${ENGINE_CONTROLLER_TOKEN}
      ENGINE_NAMESPACE: ${ENGINE_NAMESPACE:-${COMPOSE_PROJECT_NAME:-video-engines}}
      ENGINE_NETWORK: ${ENGINE_NETWORK:-${COMPOSE_PROJECT_NAME:-video-engines}-engine}
      ENGINE_GPU_UUID: ${ENGINE_GPU_UUID:-}
      HF_CACHE_VOLUME: ${HF_CACHE_VOLUME:-livepeer-video-hf-cache}
      MODELS_VOLUME: ${MODELS_VOLUME:-livepeer-video-model-weights}
      ENGINE_CACHE_VOLUME: ${ENGINE_CACHE_VOLUME:-livepeer-video-engine-cache}
      LIGHTX2V_ENGINE_IMAGE: ${LIGHTX2V_ENGINE_IMAGE:-}
    volumes:
      - ${ENGINE_CONTROLLER_CATALOG:-./configs/controller/${ENGINE:-all}.json}:/config/catalog.json:ro
      - controller-state:/state
      - gpu-leases:/leases
    depends_on:
      socket-proxy:
        condition: service_started
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import os, urllib.request; urllib.request.urlopen('http://${CONTROL_SUBNET_PREFIX:-172.30.89}.20:9200/healthz', timeout=3)",
        ]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 10s
    networks:
      control:
        ipv4_address: ${CONTROL_SUBNET_PREFIX:-172.30.89}.20
        aliases: [controller-control]
      engine: {}
      docker-api: {}
  socket-proxy:
    restart: unless-stopped
    image: ghcr.io/tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./configs/docker-socket-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks: [docker-api]
networks:
  default:
    ipam:
      config:
        - subnet: ${SUBNET_PREFIX:-172.30.88}.0/24
  control:
    internal: true
    ipam:
      config:
        - subnet: ${CONTROL_SUBNET_PREFIX:-172.30.89}.0/24
  engine:
    ipam:
      config:
        - subnet: ${ENGINE_SUBNET_PREFIX:-172.30.90}.0/24
    name: ${ENGINE_NETWORK:-${COMPOSE_PROJECT_NAME:-video-engines}-engine}
  docker-api:
    internal: true
    ipam:
      config:
        - subnet: ${DOCKER_API_SUBNET_PREFIX:-172.30.91}.0/24
volumes:
  controller-state:
    external: true
    name: ${CONTROLLER_STATE_VOLUME:-${COMPOSE_PROJECT_NAME:-video-engines}-controller-state}
  gpu-leases:
    external: true
    name: ${GPU_LEASE_VOLUME:-livepeer-video-gpu-leases}
